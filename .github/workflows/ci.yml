name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  alerts-service:
    # Java microservice: unit tests (JUnit 5 + Mockito), MVC slice, contract test and
    # integration tests with real RabbitMQ + MongoDB (Testcontainers uses the runner's Docker).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerts-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests (kubeconform)
        run: >
          docker run --rm -v "$PWD/k8s":/k8s ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary -ignore-filename-pattern 'kustomization.yaml|README.md' /k8s

  evals-offline:
    # Exercises the whole eval harness with the offline provider (no cost, no keys).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m evals.run --suite all --subset ci --models fake:fake

  evals-llm-smoke:
    # Small real-LLM subset, only when the GROQ_API_KEY secret is configured. Runs on main (and on
    # demand) instead of every push: the free tier has a daily token quota that full evals need.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The key is stored as an environment secret (environment "GROQ_API_KEY").
    environment: GROQ_API_KEY
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Groq free tier: 8k tokens/min → one chunk at a time, rely on retry-after for the rest.
      EXTRACTION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.12"
      - run: uv sync --locked
        if: env.GROQ_API_KEY != ''
      - name: LLM eval subset (extraction + agent, ~cents)
        if: env.GROQ_API_KEY != ''
        # Regressions are reported, not enforced: on a 4-statement subset run-to-run noise (F1 ±3pts,
        # latency x2 under rate limits) is bigger than the regression thresholds.
        run: uv run python -m evals.run --suite extraction,agent --subset ci
      - name: Upload eval results
        if: always() && env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: evals/results/
      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not set; skipping LLM evals."
