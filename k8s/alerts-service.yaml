# alerts-service (Java/Spring Boot). Stateless: scale out — RabbitMQ load-balances the queue
# between replicas (competing consumers); MongoDB's unique index keeps processing idempotent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-service
  labels: {app: alerts-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: alerts-service}
  template:
    metadata:
      labels: {app: alerts-service}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1001}
      containers:
        - name: alerts-service
          image: financasia-alerts:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081, name: http}]
          envFrom:
            - configMapRef: {name: financasia-config}
            - secretRef: {name: financasia-secrets}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-service
spec:
  selector: {app: alerts-service}
  ports: [{port: 8081, targetPort: http, name: http}]
