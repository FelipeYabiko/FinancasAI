# FinançasIA app (Python/FastAPI). One replica: SQLite lives on a single volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: financasia-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financasia-app
  labels: {app: financasia-app}
spec:
  replicas: 1
  strategy: {type: Recreate}  # never two pods on the same SQLite file
  selector:
    matchLabels: {app: financasia-app}
  template:
    metadata:
      labels: {app: financasia-app}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: app
          image: financasia:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: financasia-config}
            - secretRef: {name: financasia-secrets}
          volumeMounts: [{name: data, mountPath: /app/data}]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: financasia-data}
---
apiVersion: v1
kind: Service
metadata:
  name: financasia-app
spec:
  selector: {app: financasia-app}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financasia
spec:
  rules:
    - host: financasia.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: financasia-app, port: {name: http}}
